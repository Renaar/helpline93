tab: Généralités
title: Accueil et prise d'appel
keywords: [accueil, appel, ticket, procédure, client, base clients]
revision: { night: 1 }
body: |
  ## 1-A — Décrocher
  Le standard transfère chaque appel sur une ligne libre. Décrochez sans attendre : un client qui patiente est un client qui s'énerve.

  ## 1-B — Identifier le client
  - Demandez le **numéro de série** inscrit à l'arrière de l'appareil.
  - Notez le **modèle** et la date d'achat si le client les connaît.
  - Vérifiez la fiche dans la **Base Clients** (recherche par nom, numéro de série ou ville).

  ## 1-C — Écouter avant d'agir
  Laissez le client décrire la panne. Notez les symptômes exacts : un mot mal compris coûte un déplacement de technicien.

  ## 1-D — Clore le ticket
  Chaque appel se termine par un **code de résolution** (voir page 5). Choisissez le code qui correspond à l'intervention réalisée, jamais un autre.

  > Service de nuit : suivez les procédures à la lettre. Toute initiative doit être signalée au chef de service.
