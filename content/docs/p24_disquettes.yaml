body: |
  ## 24-A — « Disque non formaté »
  Le lecteur ne reconnaît pas la disquette. Dans la plupart des cas, **les données sont intactes**.

  > Ne faites **jamais** formater une disquette qui contient des données : la commande FORMAT efface tout, sans retour possible.

  ## 24-B — Disquettes HD et DD
  | Disquette | Inscription | Lecteur nécessaire |
  | Double densité | DD — 720 Ko | 720 Ko ou 1,44 Mo |
  | Haute densité | HD — 1,44 Mo | 1,44 Mo uniquement |

  Une disquette HD lue par un lecteur réglé en 720 Ko affiche « Disque non formaté ».

  ## 24-C — Type de lecteur dans le SETUP
  Le type du lecteur A est enregistré dans le SETUP du BIOS (touche **Suppr** pendant le test de la mémoire). Sur les HX-386 et HX-486, il doit être réglé sur **1.44M**.

  Si l'horloge de l'ordinateur revient au **1er janvier 1980**, la pile de la carte mère est usée : le SETUP perd ses réglages à chaque arrêt. Corrigez le réglage, puis proposez le remplacement de la pile. Code **R-03**.

