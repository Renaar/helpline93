id: e.n01.kessler_accueil
from: R. Kessler
address: r.kessler@heltron.corp
subject: Votre premier service
body: |
  Bonsoir,

  Bienvenue au service de nuit. Vous occupez désormais le poste NL-04.

  Quelques règles, que je n'aurai pas à répéter :
  - Les appels arrivent par le standard. Décrochez sans attendre.
  - Le **manuel de procédures** (Visionneuse) contient tout ce dont vous avez besoin. Suivez-le à la lettre.
  - Les fiches de nos clients sont dans la **Base Clients**.
  - Chaque ticket se clôt avec un **code de résolution** (manuel, page 5). Un seul code, le bon.

  Votre prédécesseur, Marc, a quitté le service précipitamment. Ses dossiers en cours ont été réaffectés. Vous n'avez pas à vous en occuper.

  Le rapport de fin de service est automatique. Je le lirai demain matin.

  R. Kessler
  Chef du service de nuit « Nightline »
  Heltron Computer Corp.
